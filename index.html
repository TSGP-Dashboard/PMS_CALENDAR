
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preventive Maintenance Calendar</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #e2e8f0;
      --hvac-color: #3182ce;
      --electrical-color: #dd6b20;
      --plumbing-color: #319795;
      --safety-color: #e53e3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

    .container { max-width: 1100px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.5rem; }

    .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .btn { background: #fff; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #edf2f7; }

    /* Category Filters & Legend */
    .legend { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    
    .dot.hvac { background-color: var(--hvac-color); }
    .dot.electrical { background-color: var(--electrical-color); }
    .dot.plumbing { background-color: var(--plumbing-color); }
    .dot.safety { background-color: var(--safety-color); }

    /* Calendar Grid */
    .calendar { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8fafc; border-bottom: 1px solid var(--border-color); text-align: center; font-weight: 600; font-size: 0.85rem; padding: 10px 0; color: var(--text-muted); }
    
    .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .day-cell { min-height: 100px; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px; position: relative; background: #fff; }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell.empty { background: #f8fafc; }

    .date-num { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .today .date-num { color: #2b6cb0; font-weight: 800; }

    /* Maintenance Task Pills */
    .task { font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; color: white; margin-bottom: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .task.hvac { background-color: var(--hvac-color); }
    .task.electrical { background-color: var(--electrical-color); }
    .task.plumbing { background-color: var(--plumbing-color); }
    .task.safety { background-color: var(--safety-color); }

    /* Simple Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 10; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; max-width: 400px; width: 90%; }
    .modal-header { font-weight: 700; margin-bottom: 12px; font-size: 1.1rem; }
    .modal-body { font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .close-btn { width: 100%; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="monthYear">Calendar</h1>
    <div class="controls">
      <button class="btn" onclick="changeMonth(-1)">&larr; Prev</button>
      <button class="btn" onclick="resetToToday()">Today</button>
      <button class="btn" onclick="changeMonth(1)">Next &rarr;</button>
    </div>
  </header>

  <!-- Filter / Legend -->
  <div class="legend">
    <span class="legend-item"><span class="dot hvac"></span> HVAC</span>
    <span class="legend-item"><span class="dot electrical"></span> Electrical</span>
    <span class="legend-item"><span class="dot plumbing"></span> Plumbing</span>
    <span class="legend-item"><span class="dot safety"></span> Safety / Alarms</span>
  </div>

  <!-- Calendar Base -->
  <div class="calendar">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days" id="calendarDays"></div>
  </div>
</div>

<!-- Task Details Modal -->
<div class="modal" id="taskModal">
  <div class="modal-content">
    <div class="modal-header" id="modalTitle">Task Details</div>
    <div class="modal-body" id="modalBody"></div>
    <button class="btn close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  // Sample Maintenance Tasks Schedule
  const tasks = [
    { day: 5, category: 'hvac', title: 'Replace HVAC Air Filters', desc: 'Inspect and replace air intake filters across all main units.' },
    { day: 12, category: 'safety', title: 'Test Smoke & CO Detectors', desc: 'Perform manual button test and check battery power levels.' },
    { day: 15, category: 'plumbing', title: 'Inspect Water Heater', desc: 'Check pressure relief valve and inspect connections for leaks.' },
    { day: 20, category: 'electrical', title: 'Inspect Main Circuit Panels', desc: 'Check panel temperatures with thermal scanner for hot spots.' },
    { day: 25, category: 'safety', title: 'Fire Extinguisher Inspection', desc: 'Verify pressure gauge needles are in the green zone.' }
  ];

  let currentDate = new Date();

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    // Set Header
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('monthYear').innerText = `${monthNames[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();

    const calendarDays = document.getElementById('calendarDays');
    calendarDays.innerHTML = '';

    // Render empty start padding
    for (let i = 0; i < firstDayIndex; i++) {
      calendarDays.innerHTML += `<div class="day-cell empty"></div>`;
    }

    // Render active days
    const today = new Date();
    for (let day = 1; day <= lastDay; day++) {
      const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      
      // Check for scheduled tasks
      const dayTasks = tasks.filter(t => t.day === day);
      let taskHtml = '';
      
      dayTasks.forEach(task => {
        taskHtml += `<div class="task ${task.category}" onclick="showTask('${task.title}', '${task.desc}')">${task.title}</div>`;
      });

      calendarDays.innerHTML += `
        <div class="day-cell ${isToday ? 'today' : ''}">
          <div class="date-num">${day}</div>
          ${taskHtml}
        </div>
      `;
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  function resetToToday() {
    currentDate = new Date();
    renderCalendar();
  }

  function showTask(title, desc) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerText = desc;
    document.getElementById('taskModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('taskModal').style.display = 'none';
  }

  // Initial load
  renderCalendar();
</script>

</body>
</html>
